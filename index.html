<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bora Resenhar?</title>
<meta name="description" content="O jogo do grupo de amigos: quiz, impostor, verdade ou verdade, desenhar, fofocar e descobrir quem é o Bobão.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
:root{--bg:#0b141a;--bg2:#111b21;--panel:#1b2830;--panel2:#26353e;--line:#2c3a43;--txt:#eef2f4;--mut:#8ea0aa;--green:#25d366;--green2:#00a884;--me:#005c4b;--yel:#ffd23f;--pink:#ff5c8a;--red:#ff4d4d;--blue:#4cc9f0;--ink:#15191d}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--txt);font-family:Nunito,system-ui,sans-serif;padding-bottom:76px;
 background-image:radial-gradient(circle at 12% 0%,#13402f 0,transparent 38%),radial-gradient(circle at 100% 100%,#33183a 0,transparent 42%),radial-gradient(#ffffff09 1.2px,transparent 1.2px);
 background-size:auto,auto,22px 22px;background-attachment:fixed}
button{font:inherit;cursor:pointer;color:inherit}
.spr{width:1.25em;height:1.25em;display:inline-block;vertical-align:-.25em;flex:none;overflow:visible}
.spr.s2{width:2em;height:2em}.spr.s3{width:3em;height:3em}.spr.s4{width:4.2em;height:4.2em}.spr.s6{width:6.5em;height:6.5em}
.btn{background:var(--green2);color:#fff;border:0;border-radius:14px;padding:10px 16px;font-weight:800;box-shadow:0 4px 0 #00684f;transition:transform .08s,filter .1s,box-shadow .08s;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover:not(:disabled){filter:brightness(1.1)}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 #00684f}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.big{font-size:1.12rem;padding:14px 26px;border-radius:16px}
.btn.sm{padding:6px 10px;font-size:.85rem;border-radius:10px;box-shadow:0 3px 0 #0005}
.btn.ghost{background:var(--panel2);box-shadow:0 4px 0 #0b1216}
.btn.yel{background:var(--yel);color:#222;box-shadow:0 4px 0 #b38f12}
.btn.pink{background:var(--pink);box-shadow:0 4px 0 #a8264f}
input,select,textarea{font:inherit;background:var(--panel2);color:var(--txt);border:2px solid var(--line);border-radius:12px;padding:10px 12px;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--green)}
textarea{width:min(560px,92vw);resize:vertical}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mt{margin-top:14px}
.muted{color:var(--mut)}.small{font-size:.85rem}
.hl{color:var(--yel)}
.lbl{font-weight:700;font-size:.9rem;color:var(--mut)}
#top{display:flex;align-items:center;gap:12px;padding:8px 16px;background:#0e171dee;backdrop-filter:blur(6px);border-bottom:2px solid var(--line);position:sticky;top:0;z-index:20;flex-wrap:wrap}
.brand{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:1.3rem;display:flex;align-items:center;gap:6px}.brand b{color:var(--yel)}
.tphase{flex:1;font-weight:800;color:var(--mut);min-width:120px;display:flex;align-items:center;gap:6px}
.tright{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.timer{font-weight:800;background:var(--panel2);padding:4px 12px 4px 8px;border-radius:99px;min-width:72px;text-align:center;font-variant-numeric:tabular-nums;display:inline-flex;align-items:center;gap:6px}
.timer.low{background:var(--red);animation:pulse .5s infinite alternate}
.tcode{font-size:.85rem;color:var(--mut)}.tcode b{color:var(--yel);letter-spacing:.1em}
main{padding:18px 16px;max-width:1300px;margin:0 auto}
.panel,.card{background:linear-gradient(180deg,#14212a,#101a20);border:2px solid var(--line);border-radius:18px;padding:16px}
.card{padding:18px}
.ptitle{font-weight:800;margin-bottom:8px;display:flex;align-items:center;gap:8px}
/* home */
.home{display:flex;flex-direction:column;align-items:center;gap:16px;padding-top:3vh;text-align:center}
.hero{display:flex;align-items:center;gap:18px;flex-wrap:wrap;justify-content:center}
.hero .spr{filter:drop-shadow(0 6px 0 #0006);animation:bounce 1.2s infinite alternate ease-in-out}
.logo{font-family:'Baloo 2',sans-serif;font-size:clamp(2.8rem,8vw,5rem);font-weight:800;line-height:.92;text-align:left;text-shadow:0 5px 0 #000a;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill}
.logo b{color:var(--yel)}
.tag{color:var(--pink);font-weight:800;font-size:1.2rem;margin:0}
.homecard{width:min(420px,92vw);display:flex;flex-direction:column;gap:10px;text-align:left}
.or{text-align:center;color:var(--mut);font-size:.85rem;margin-top:6px}
.hstatus{min-height:1.2em;color:var(--yel);font-weight:700;text-align:center}
.modeprev{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:760px}
.mp{background:var(--panel);border:2px solid var(--line);border-radius:99px;padding:6px 14px 6px 8px;font-weight:700;font-size:.9rem;display:flex;align-items:center;gap:6px}
/* lobby */
.lobby{display:grid;grid-template-columns:270px 1fr 340px;gap:16px;align-items:start}
@media(max-width:1050px){.lobby{grid-template-columns:1fr}}
.bigcode{font-family:'Baloo 2',sans-serif;font-size:3rem;letter-spacing:.25em;color:var(--yel);text-align:center;font-weight:800;line-height:1.1;margin:4px 0 10px;text-shadow:0 4px 0 #0008}
.plist{display:flex;flex-direction:column;gap:6px}
.pl{display:flex;align-items:center;gap:8px;background:var(--panel);padding:6px 10px;border-radius:12px}
.pl.off{opacity:.4}
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.mcard{background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:4px;position:relative;transition:transform .1s}
.mcard:hover:not(:disabled){transform:translateY(-2px)}
.mcard:disabled{cursor:default;opacity:1}
.mcard.on{border-color:var(--green);background:#123326}
.mcard:not(.on){opacity:.65}
.mcard .chk{position:absolute;top:10px;right:10px}
.mtile{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;border:2px solid var(--ink);box-shadow:0 3px 0 #0007;margin-bottom:4px}
.mtile .spr{width:36px;height:36px}
.mcard .mt2{font-weight:800}.mcard .md{font-size:.8rem;color:var(--mut)}
/* avatars */
.av{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;width:36px;height:36px;font-weight:800;color:#111;overflow:hidden;flex:none;background:#fff;vertical-align:middle;border:2px solid var(--ink);box-shadow:0 2px 0 #0006}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.av .spr{width:115%;height:115%}
.av.xs{width:22px;height:22px;border-width:1.5px;box-shadow:none}.av.sm{width:30px;height:30px}.av.md{width:42px;height:42px}.av.lg{width:68px;height:68px;border-width:3px}.av.xl{width:150px;height:150px;border-width:4px}
/* chat */
.chatbox{display:flex;flex-direction:column;height:58vh;min-height:340px;background:#0b141a;border-radius:14px;overflow:hidden;border:2px solid var(--line)}
.chatbox.tall{height:66vh}
.msgs{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:6px;background-image:radial-gradient(#ffffff08 1px,transparent 1px);background-size:18px 18px}
.msg{display:flex;gap:6px;align-items:flex-end;max-width:88%}
.msg.me{align-self:flex-end;flex-direction:row-reverse}
.bub{background:var(--panel);padding:6px 10px;border-radius:12px;border-bottom-left-radius:3px;word-break:break-word;text-align:left;box-shadow:0 2px 0 #0005}
.msg.me .bub{background:var(--me);border-bottom-left-radius:12px;border-bottom-right-radius:3px}
.bub b{display:block;font-size:.78rem;margin-bottom:1px}
.sys{align-self:center;background:#182229;color:#ffd279;font-size:.82rem;padding:5px 10px;border-radius:9px;text-align:center;max-width:92%;display:flex;align-items:center;gap:6px}
.sys .spr{width:20px;height:20px}
.chatstk{width:120px;height:120px;object-fit:contain;display:block}
.sendbar{display:flex;gap:6px;padding:8px;background:var(--bg2)}
.sendbar input{flex:1;min-width:0}
.ib{background:var(--panel2);border:0;border-radius:50%;width:42px;height:42px;flex:none;display:flex;align-items:center;justify-content:center}
.ib .spr{width:24px;height:24px}
.sendb{background:var(--green2)}
.stkpick{display:flex;flex-wrap:wrap;gap:6px;padding:8px;max-height:160px;overflow:auto;background:var(--panel)}
.stkpick button{background:#fff1;border:1px solid var(--line);border-radius:8px;padding:2px}
.stkpick img{width:58px;height:58px;object-fit:contain;display:block}
.cnote{padding:6px 10px;background:#3b2f0b;color:var(--yel);font-size:.85rem;font-weight:800;display:flex;gap:6px;align-items:center}
/* drawing */
.pad{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;align-items:flex-start}
.cwrap{position:relative;width:min(480px,92vw);aspect-ratio:1;border-radius:16px;overflow:hidden;background:#fff;box-shadow:0 6px 0 #0007,0 10px 30px #0008;border:3px solid var(--ink);flex:none}
.cwrap canvas{width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
.checker{background:repeating-conic-gradient(#e4e4e4 0 25%,#fff 0 50%) 0 0/24px 24px}
.cguide{position:absolute;inset:3%;border:3px dashed #0003;border-radius:50%;pointer-events:none}
.board{width:min(560px,92vw)}
.board canvas{cursor:not-allowed}.board canvas.active{cursor:crosshair;outline:5px solid var(--yel);outline-offset:-5px}
.tools{display:flex;flex-direction:column;gap:10px;width:236px;background:linear-gradient(180deg,#14212a,#101a20);border:2px solid var(--line);border-radius:16px;padding:12px}
@media(max-width:780px){.tools{width:min(480px,92vw)}}
.trow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tools button{background:var(--panel2);border:2px solid transparent;border-radius:11px;min-width:42px;height:42px;display:inline-flex;align-items:center;justify-content:center;box-shadow:0 3px 0 #0006}
.tools button .spr{width:26px;height:26px}
.tools button.on{border-color:var(--yel);background:#3a3a1a}
.colors button{width:28px;min-width:28px;height:28px;border-radius:50%;border:2px solid var(--ink);box-shadow:0 2px 0 #0007}
.colors button.on{border:3px solid var(--yel);transform:scale(1.15)}
.sizes i{display:inline-block;background:#fff;border-radius:50%}
.stamps button{padding:0;overflow:hidden;border-radius:50%;width:42px}
.stamps img{width:38px;height:38px;border-radius:50%;object-fit:cover;background:#fff}
.textrow input{width:100%}
/* stage */
.stage{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.headline{font-family:'Baloo 2',sans-serif;font-size:clamp(1.4rem,3vw,2rem);font-weight:800;line-height:1.15;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;text-shadow:0 3px 0 #0007}
.headline .spr{width:1.5em;height:1.5em}
.headline.sm{font-size:1.3rem}
.bigico{animation:bounce 1s infinite alternate ease-in-out;filter:drop-shadow(0 6px 0 #0007)}
.rules{text-align:left;max-width:560px}.rules li{margin:6px 0}
.pill{background:var(--panel2);border-radius:99px;padding:4px 12px;font-weight:800;font-size:.85rem}
.sentbox{background:#123326;border:2px solid var(--green);border-radius:16px;padding:16px 24px;font-weight:800;font-size:1.1rem;display:flex;align-items:center;gap:10px}
.secret{background:linear-gradient(135deg,#3a2a00,#1f2c34);border:2px dashed var(--yel);border-radius:16px;padding:12px 16px;font-weight:700;text-align:left}
.secret.carl{background:linear-gradient(135deg,#4a0b25,#1f2c34);border-color:var(--pink)}
.secret .sh{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.secret ul{margin:8px 0;padding-left:18px}.secret li{margin:4px 0}
.secret .big{font-size:1.6rem;font-family:'Baloo 2',sans-serif}
.themecard{background:linear-gradient(135deg,#1d3b2f,#2a1630);border:2px solid var(--yel);border-radius:18px;padding:12px 22px;box-shadow:0 5px 0 #0007}
.themecard small{color:var(--yel);font-weight:800;letter-spacing:.1em}
.actions{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.quote{font-size:1.3rem;font-weight:800;background:var(--panel);padding:12px 20px;border-radius:14px;max-width:640px;border:2px solid var(--line)}
.fofimg img{width:min(380px,85vw);border-radius:14px;background:#fff;display:block;border:3px solid var(--ink)}
.vacuo{padding:40px;background:var(--panel);border-radius:14px}
/* votes / galleries */
.vgrid{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.vbtn{background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:110px;font-weight:800;box-shadow:0 4px 0 #0006;transition:transform .1s}
.vbtn.on{border-color:var(--yel);background:#2b2a12}
.vbtn:hover:not(:disabled){border-color:var(--green);transform:translateY(-2px)}
.vbtn:disabled{cursor:default}
.gal{display:flex;flex-wrap:wrap;gap:16px;justify-content:center}
.gitem{background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:180px;box-shadow:0 4px 0 #0006}
.gitem:hover:not(:disabled){border-color:var(--green)}
.gitem.on{border-color:var(--yel)}.gitem:disabled{cursor:default}
.gitem .votes{color:var(--yel);font-weight:800}
.versus{display:flex;gap:24px;align-items:center;justify-content:center;flex-wrap:wrap}
.fig{background:var(--panel);border:3px solid var(--line);border-radius:22px;padding:14px;width:min(330px,80vw);display:flex;flex-direction:column;align-items:center;gap:8px;transition:all .3s;box-shadow:0 5px 0 #0007}
.fig img{width:100%;aspect-ratio:1;object-fit:contain;display:block;background:repeating-conic-gradient(#ffffff0c 0 25%,transparent 0 50%) 0 0/24px 24px;border-radius:12px}
.fig:hover:not(:disabled){border-color:var(--green)}
.fig.on{border-color:var(--yel)}
.fig.win{border-color:var(--yel);transform:scale(1.04);box-shadow:0 0 40px #ffd23f55}
.fig.lose{opacity:.35;filter:grayscale(1)}
.fig.champ{width:min(400px,86vw)}
.fig b{display:flex;align-items:center;gap:6px}
.vs{font-family:'Baloo 2',sans-serif;font-size:3.2rem;font-weight:800;color:var(--pink);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 #0008;transform:rotate(-8deg)}
.byline{display:flex;align-items:center;gap:8px;font-size:1.1rem}
/* rabisco */
.rabisco{display:grid;grid-template-columns:300px 1fr;gap:16px;align-items:start}
@media(max-width:900px){.rabisco{grid-template-columns:1fr}}
.rleft{display:flex;flex-direction:column;gap:12px}
.rcenter{display:flex;flex-direction:column;align-items:center;gap:10px}
.ochip{display:inline-block;border:3px solid;border-radius:50%;margin:2px;opacity:.9;line-height:0}
.ochip.cur{transform:scale(1.35);box-shadow:0 0 0 3px var(--yel)}
.ochip.past{opacity:.3}
.rvote{display:flex;gap:20px;flex-wrap:wrap;justify-content:center;align-items:flex-start}
.mini .cwrap{width:min(340px,86vw)}
/* marcar */
.marcar{display:grid;grid-template-columns:290px 1fr 300px;gap:14px;align-items:start}
@media(max-width:1100px){.marcar{grid-template-columns:1fr}}
.mission{font-family:'Baloo 2',sans-serif;font-size:1.35rem;font-weight:800;line-height:1.2;margin-bottom:6px}
.poll{margin-bottom:14px;text-align:left}
.popt{position:relative;display:flex;align-items:center;justify-content:space-between;gap:6px;width:100%;background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:8px 10px;margin-bottom:6px;overflow:hidden;text-align:left}
.popt.on{border-color:var(--green)}
.popt:disabled{cursor:default}
.pbar{position:absolute;left:0;top:0;bottom:0;background:#25d36630;z-index:0;transition:width .3s}
.plabel,.pvoters{position:relative;z-index:1}.plabel{display:flex;align-items:center;gap:6px}.pvoters{display:flex;gap:1px}
.mae{background:#5a1a3a;color:#ffd6e7;padding:8px;border-radius:12px;font-weight:800;text-align:center;margin-bottom:8px;animation:pulse .8s infinite alternate;display:flex;align-items:center;justify-content:center;gap:10px}
.audio{margin-top:12px;background:#2b2412;border:2px solid var(--yel);border-radius:16px;padding:12px;text-align:center}
.audio p{margin:0 0 8px}
.hbar{height:10px;background:#0006;border-radius:9px;overflow:hidden;margin-top:8px}.hbar i{display:block;height:100%;width:0;background:var(--yel)}
.plan{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.plan div{background:var(--panel);border:2px solid var(--green);border-radius:14px;padding:10px 16px;font-weight:800;box-shadow:0 4px 0 #0006}
.plan small{display:block;color:var(--mut);font-weight:700}
.viol{background:#3a1218;border:2px solid var(--red);border-radius:12px;padding:8px 14px;margin:4px 0;text-align:left;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.cardsgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;width:min(1000px,94vw)}
.pcards{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:10px;text-align:left;font-size:.88rem}
.pcards.carl{border-color:var(--pink)}
.pcards ul{margin:6px 0 0;padding-left:16px}
/* quem */
.qlist{display:flex;flex-direction:column;gap:14px;width:min(760px,94vw)}
.qmsg{background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.bub.anon{font-size:1.08rem;max-width:100%;background:var(--panel2)}
.bub.anon b{display:flex;align-items:center;gap:4px}
.qpick{display:flex;flex-wrap:wrap;gap:6px}
.qp{background:var(--panel2);border:2px solid transparent;border-radius:12px;padding:4px 8px;display:flex;align-items:center;gap:6px}
.qp.on{border-color:var(--yel);background:#3a3a1a}.qp:disabled{cursor:default}
.right{font-size:.85rem;color:var(--green);display:flex;gap:4px;align-items:center;flex-wrap:wrap}
/* reveal thread */
.thread{width:min(660px,94vw);display:flex;flex-direction:column;gap:12px}
.tmsg{display:flex;gap:8px;align-items:flex-start;animation:pop .35s}
.tmsg .bub{font-size:1.1rem}
.tmsg .bub img{width:min(360px,68vw);border-radius:10px;background:#fff;display:block}
.tmsg .bub .big{font-size:1.25rem;font-weight:800}
/* ranking / retro */
.rank{display:flex;flex-direction:column;gap:8px;width:min(560px,94vw)}
.rk{display:flex;align-items:center;gap:12px;background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:10px 14px;box-shadow:0 3px 0 #0006}
.rk.mine{border-color:var(--green)}
.rk .pos{font-weight:800;width:34px;display:flex;justify-content:center}.rk .pos .spr{width:30px;height:30px}
.rk .nm{flex:1;text-align:left;font-weight:800}
.rk .pts{font-weight:800;color:var(--yel)}.rk .dl{color:var(--green);font-weight:800;font-size:.9rem}.rk .dl.neg{color:var(--red)}
.podium{display:flex;align-items:flex-end;gap:12px;justify-content:center}
.pod{display:flex;flex-direction:column;align-items:center;gap:4px;width:130px}
.pod .block{width:100%;background:linear-gradient(#2a3942,#1f2c34);border:2px solid var(--ink);border-bottom:0;border-radius:14px 14px 0 0;display:flex;align-items:flex-start;justify-content:center;padding-top:8px}
.pod .block .spr{width:44px;height:44px}
.pod.p1 .block{height:140px;background:linear-gradient(#ffd23f,#b8901c)}.pod.p2 .block{height:100px}.pod.p3 .block{height:70px}
.awards{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;width:min(1000px,94vw)}
.award{background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:0 4px 0 #0006}
.award .spr{width:54px;height:54px;filter:drop-shadow(0 3px 0 #0007)}
.award .at{font-weight:800;color:var(--yel)}.award small{color:var(--mut)}
.offc{display:flex;flex-direction:column;align-items:center;gap:8px}
/* quiz */
.qq{max-width:820px}
.qgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:min(820px,94vw)}
@media(max-width:640px){.qgrid{grid-template-columns:1fr}}
.qopt{background:var(--qc);color:#fff;border:3px solid var(--ink);border-radius:18px;padding:14px 16px;font-weight:800;font-size:1.1rem;display:flex;align-items:center;gap:12px;text-align:left;box-shadow:0 5px 0 #0008;min-height:74px;transition:transform .08s,opacity .2s}
button.qopt:hover:not(:disabled){transform:translateY(-2px)}
.qopt:disabled{cursor:default}
.qopt.on{outline:4px solid #fff;outline-offset:2px}
.qopt.dim{opacity:.35}
.qopt.right{outline:4px solid var(--yel);outline-offset:2px;transform:scale(1.03)}
.ql{width:36px;height:36px;border-radius:10px;background:#0004;display:flex;align-items:center;justify-content:center;flex:none;font-family:'Baloo 2',sans-serif}
.ql .spr{width:28px;height:28px}
.qwho{margin-left:auto;display:flex;gap:2px}
.qres{font-family:'Baloo 2',sans-serif;font-size:1.6rem;font-weight:800;display:flex;align-items:center;gap:8px;padding:10px 22px;border-radius:16px;border:2px solid}
.qres.ok{background:#123326;border-color:var(--green)}.qres.bad{background:#3a1218;border-color:var(--red)}
/* impostor */
.clues{display:flex;flex-direction:column;gap:8px}
.crow{display:flex;align-items:center;gap:10px;background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:8px 12px;text-align:left}
.crow.cur{border-color:var(--yel)}
.crow b{min-width:90px}
.cchips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:var(--panel2);border:2px solid var(--ink);border-radius:99px;padding:3px 12px;font-weight:800;box-shadow:0 2px 0 #0006}
.chip.off{opacity:.45;font-weight:600}
.chip.typing{background:transparent;border-style:dashed;border-color:var(--mut);color:var(--mut);box-shadow:none;animation:pulse .8s infinite alternate}
/* verdade */
.hotseat{display:flex;flex-direction:column;align-items:center;gap:8px}
.vcards{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
.vcard{width:min(340px,90vw);background:linear-gradient(135deg,#0d3b33,#14212a);border:3px solid #06d6a0;border-radius:20px;padding:20px;font-weight:800;font-size:1.1rem;display:flex;flex-direction:column;align-items:center;gap:10px;box-shadow:0 5px 0 #0008;transition:transform .1s}
.vcard:hover:not(:disabled){transform:translateY(-3px) rotate(-1deg)}
.vcard:disabled{cursor:default}
.quote.big{font-size:1.5rem;display:flex;align-items:center;gap:10px}
.answer{font-family:'Baloo 2',sans-serif;font-size:1.8rem;font-weight:800;background:var(--panel);border:3px solid var(--yel);border-radius:18px;padding:14px 24px;max-width:760px;display:flex;align-items:center;gap:10px;box-shadow:0 5px 0 #0008}
.verdict{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
.vside{background:var(--panel);border:3px solid;border-radius:18px;padding:14px 20px;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:200px}
.vside.ok{border-color:#06d6a0}.vside.bad{border-color:var(--pink)}
.vside span{display:flex;gap:3px;flex-wrap:wrap;justify-content:center}
/* fx */
#fx{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
.fl{position:absolute;bottom:-80px;display:flex;flex-direction:column;align-items:center;animation:rise 2.8s ease-out forwards}
.fl .spr{width:52px;height:52px;filter:drop-shadow(0 4px 0 #0007)}
.fl small{background:#000b;padding:1px 7px;border-radius:7px;font-weight:800;font-size:.75rem}
.cf{position:absolute;top:-20px;width:10px;height:16px;border-radius:3px;border:1.5px solid var(--ink);animation:fall 2.6s ease-in forwards}
#reacts{position:fixed;left:12px;bottom:12px;display:flex;gap:2px;background:var(--bg2);border:2px solid var(--line);border-radius:99px;padding:4px 8px;z-index:40;box-shadow:0 5px 0 #0008}
#reacts button{background:none;border:0;padding:3px;border-radius:50%;transition:transform .1s;display:flex}
#reacts .spr{width:30px;height:30px}
#reacts button:hover{transform:scale(1.25) rotate(-6deg)}
#toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%) translateY(20px);background:#000d;padding:10px 18px;border-radius:12px;font-weight:800;opacity:0;transition:all .25s;z-index:90;pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%)}
.overlay{position:fixed;inset:0;background:#000c;display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
.ovc{max-width:440px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
@keyframes rise{to{transform:translateY(-80vh) rotate(var(--r,12deg));opacity:0}}
@keyframes fall{to{transform:translateY(105vh) rotate(var(--r,540deg))}}
@keyframes pulse{to{filter:brightness(1.35)}}
@keyframes pop{from{transform:scale(.85);opacity:0}}
@keyframes bounce{to{transform:translateY(-10px) rotate(-4deg)}}
</style>
</head>

(function injectSprites(){
 const wrap=v=>`<g stroke="#15191d" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">${v}</g>`;
 const defs=Object.entries(SPR).map(([k,v])=>`<symbol id="s-${k}" viewBox="0 0 32 32">${wrap(v)}</symbol>`).join('');
 document.body.insertAdjacentHTML('afterbegin',`<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>${defs}</defs></svg>`);
 const ic=document.createElement('link');ic.rel='icon';ic.href='data:image/svg+xml,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">${wrap(SPR.logo)}</svg>`);document.head.append(ic);
})();

function hostCreate(name){ME.name=name;NET.isHost=true;tryHost(0)}
function tryHost(attempt){
 const code=genCode();let inited=false,peer=null;
 const init=()=>{if(inited)return;inited=true;NET.code=code;hostInit(code);hostRelayStart(code)};
 try{peer=new Peer(PREFIX+code,PEER_OPTS)}catch(e){init();return}
 NET.peer=peer;
 peer.on('open',init);
 peer.on('connection',conn=>{conn.on('data',d=>hostData(conn,d));conn.on('close',()=>hostClose(conn));conn.on('error',()=>hostClose(conn))});
 peer.on('error',e=>{
  if(e.type==='unavailable-id'&&!inited&&attempt<5){peer.destroy();tryHost(attempt+1)}
  else if(!inited)init(); // sem conexão direta: a sala funciona só pela reserva
  else console.warn('peer error',e.type);
 });
 peer.on('disconnected',()=>{setTimeout(()=>{try{if(!peer.destroyed)peer.reconnect()}catch(e){}},1500)});
 setTimeout(()=>{if(!inited)init()},8000);
}
/* host: escuta a sala nos servidores reserva */
const RELAY={clients:[],conns:{}};
async function hostRelayStart(code){
 try{await loadMqtt()}catch(e){console.warn('reserva indisponível');return}
 BROKERS.forEach((url,bi)=>{
  const c=mqtt.connect(url,{clientId:'brh'+rid(),connectTimeout:8000,reconnectPeriod:3000,keepalive:30});
  c.on('connect',()=>c.subscribe(RT(code)+'/h'));
  c.on('error',()=>{});
  c.on('message',(t,p)=>{
   let m;try{m=JSON.parse(p.toString())}catch(e){return}
   if(!m||!m.f||!m.d||typeof m.d!=='object')return;
   const pid=String(m.f).slice(0,24),key=pid+'@'+bi;
   let conn=RELAY.conns[key];
   if(!conn){conn=RELAY.conns[key]={pid:null,open:true,relay:true,send(d){if(c.connected)c.publish(RT(code)+'/c/'+pid,JSON.stringify(d))},close(){this.open=false}}}
   if(m.d.t==='join')conn.open=true;
   if(!conn.open)return;
   hostData(conn,m.d);
   if(m.d.t==='ping')conn.send({t:'pong'});
  });
  RELAY.clients.push(c);
 });
}
function clientJoin(code,name){
 ME.name=name;NET.isHost=false;NET.code=code;homeStatus('Conectando…');
 try{NET.peer&&!NET.peer.destroyed&&NET.peer.destroy()}catch(e){}
 try{NET.relay&&NET.relay.end(true)}catch(e){}NET.relay=null;
 let done=false;
 const toRelay=()=>{if(done)return;done=true;try{NET.peer&&NET.peer.destroy()}catch(e){}relayJoin(code)};
 if(new URLSearchParams(location.search).has('reserva')||typeof Peer==='undefined')return toRelay();
 let peer;try{peer=new Peer(PEER_OPTS)}catch(e){return toRelay()}
 NET.peer=peer;
 const to=setTimeout(toRelay,7000);
 peer.on('open',()=>{
  const conn=peer.connect(PREFIX+code,{reliable:true});
  conn.on('open',()=>{if(done){try{conn.close()}catch(e){}return}done=true;clearTimeout(to);NET.conn=conn;conn.send({t:'join',pid:ME.pid,name:ME.name});store.set('br_join',code);hideOverlay()});
  conn.on('data',onClientData);
  conn.on('close',()=>{if(NET.conn===conn)lostConnection()});
 });
 peer.on('error',()=>{if(!done){clearTimeout(to);toRelay()}}); // qualquer erro: tenta a reserva
}
/* cliente: conexão reserva (pega o primeiro servidor que a rede deixar) */
let lastHost=0;
async function relayJoin(code){
 homeStatus('Conexão direta bloqueada pela rede… tentando a conexão reserva');
 try{await loadMqtt()}catch(e){homeStatus('Não consegui conectar de nenhum jeito. Confira a internet.');if(V)lostConnection();return}
 let chosen=null,got=false;
 const cs=BROKERS.map(url=>{const c=mqtt.connect(url,{clientId:'brc'+rid(),connectTimeout:8000,reconnectPeriod:0,keepalive:30});c.on('error',()=>{});return c});
 const fail=setTimeout(()=>{if(!chosen){cs.forEach(c=>{try{c.end(true)}catch(e){}});homeStatus('Não consegui conectar de nenhum jeito. Confira a internet.');if(V)lostConnection()}},11000);
 cs.forEach(c=>c.on('connect',()=>{
  if(chosen){if(c!==chosen)c.end(true);return}
  chosen=c;clearTimeout(fail);cs.forEach(o=>{if(o!==c)try{o.end(true)}catch(e){}});
  c.options.reconnectPeriod=2000;NET.relay=c;
  c.on('message',(t,p)=>{let d;try{d=JSON.parse(p.toString())}catch(e){return}lastHost=Date.now();
   if(d.t==='state'&&!got){got=true;store.set('br_join',code);hideOverlay()}
   onClientData(d)});
  c.subscribe(RT(code)+'/c/'+ME.pid,()=>{
   const conn={open:true,relay:true,send(d){if(c.connected)c.publish(RT(code)+'/h',JSON.stringify({f:ME.pid,d}))},close(){this.open=false;try{c.end(true)}catch(e){}}};
   NET.conn=conn;lastHost=Date.now();conn.send({t:'join',pid:ME.pid,name:ME.name});
   setTimeout(()=>{if(!got&&NET.conn===conn){homeStatus('Sala não encontrada. Confira o código e se o anfitrião está com a sala aberta.');if(V)lostConnection()}},9000);
  });
 }));
}
setInterval(()=>{
 if(!NET.isHost&&NET.conn&&NET.conn.open){try{NET.conn.send({t:'ping'})}catch(e){}
  if(NET.conn.relay&&V&&Date.now()-lastHost>15000){NET.conn.open=false;lostConnection()}}
},3000);
function lostConnection(){
 const o=showOverlay(`${spr('skull','s4')}<h2>Caiu a conexão com a sala</h2><p class="muted">Pode ser a internet ou o anfitrião fechou o jogo.</p><button class="btn big" id="rcBtn">Reconectar</button><button class="btn ghost" id="outBtn">Sair</button>`);
 $('#rcBtn',o).onclick=()=>{$('#rcBtn',o).disabled=true;$('#rcBtn',o).textContent='Conectando…';clientJoin(NET.code,ME.name)};
 $('#outBtn',o).onclick=()=>location.reload();
}
function onClientData(d){
 if(!d||typeof d!=='object')return;
 if(d.t==='state'){clockOffset=d.now-Date.now();V={s:JSON.parse(d.s),me:JSON.parse(d.me)};render()}
 else if(d.t==='img')gotImg(d.id,d.d);
 else if(d.t==='fx'||d.t==='live')handleFx(d);
 else if(d.t==='err'){showOverlay(`${spr('x','s4')}<h2>Não deu pra entrar</h2><p>${esc(d.msg)}</p><button class="btn" onclick="location.reload()">Ok</button>`);try{NET.peer.destroy()}catch(e){}}
}
function act(a){
 if(!V)return;
 if(NET.isHost)hostAction(ME.pid,a);
 else if(NET.conn&&NET.conn.open){try{NET.conn.send({t:'act',a})}catch(e){toast('Falha ao enviar')}}
 else toast('Sem conexão com a sala…');
}
function gotImg(id,d){IMG[id]=d;$$(`img[data-img="${id}"]`).forEach(i=>i.src=d)}
function handleFx(d){

}

const H={st:null};
function hostInit(code){
 Object.assign(H,{
  st:{code,screen:'lobby',players:[],hostId:ME.pid,settings:{modes:MODE_ORDER.slice(),speed:1},chat:[],stickers:[],queue:[],modeIdx:-1,mode:null,m:null,deadline:0,deltas:{},official:null,retro:null},
  priv:{},mx:{},conns:{},lastSeen:{},lastReact:{},stats:{},images:{},imgN:0,msgId:0,onTimeout:null,gen:0,avatarBy:{},champ:null,prev:{}
 });
 H.st.players.push({id:ME.pid,name:cleanName(ME.name),color:COLORS_P[0],avatar:null,score:0,on:true});
 sysMsg(H.st.chat,'Grupo criado! Mande o código pra galera entrar','party');
 setInterval(hostLoop,300);
 window.onbeforeunload=e=>{if(H.st&&H.st.players.length>1){e.preventDefault();e.returnValue=''}};
 sync();
}
const P_=id=>H.st.players.find(p=>p.id===id);
const nameOf=id=>(P_(id)||{}).name||'?';
const activeIds=()=>H.st.players.filter(p=>p.on).map(p=>p.id);
function cleanName(n){let b=String(n||'').replace(/\s+/g,' ').trim().slice(0,16)||'Anônimo';let x=b,i=2;while(H.st&&H.st.players.some(p=>p.name.toLowerCase()===x.toLowerCase()))x=b+' '+(i++);return x}
function sysMsg(list,text,ico){list.push({id:++H.msgId,sys:true,text,ico:ico||null});if(list.length>150)list.splice(0,list.length-150)}
function stat(pid,k,n=1){const s=H.stats[pid]=H.stats[pid]||{};s[k]=(s[k]||0)+n}
function addPts(pid,n){const p=P_(pid);if(p)p.score=Math.max(0,p.score+n)}
function allDone(list,base){base=(base||H.mx.part||[]).filter(id=>(P_(id)||{}).on);return base.length>0&&base.every(id=>list.includes(id))}
function setTimer(sec,fn,scaled=true){H.st.deadline=Date.now()+Math.round(sec*1000*(scaled?H.st.settings.speed:1));H.onTimeout=fn}
function clearTimer(){H.st.deadline=0;H.onTimeout=null}
function storeImg(data){
 if(typeof data!=='string'||!data.startsWith('data:image/')||data.length>900000)return null;
 const id='i'+(++H.imgN);H.images[id]=data;IMG[id]=data;
 for(const c of Object.values(H.conns)){if(c.open)try{c.send({t:'img',id,d:data})}catch(e){}}
 return id;
}
function addSticker(id){if(id&&!H.st.stickers.includes(id))H.st.stickers.push(id)}
function broadcastFx(msg,except){
 for(const [pid,c] of Object.entries(H.conns)){if(pid!==except&&c.open)try{c.send(msg)}catch(e){}}
 if(ME.pid!==except)handleFx(msg);

let syncT=null;
function sync(){if(syncT)return;syncT=setTimeout(()=>{syncT=null;doSync()},15)}
function doSync(){
 const now=Date.now(),sj=JSON.stringify(H.st);
 for(const [pid,c] of Object.entries(H.conns)){if(c.open)try{c.send({t:'state',s:sj,me:JSON.stringify(H.priv[pid]||{}),now})}catch(e){}}
 V={s:JSON.parse(sj),me:JSON.parse(JSON.stringify(H.priv[ME.pid]||{}))};clockOffset=0;render();
}
function hostLoop(){
 const now=Date.now();let ch=false;
 for(const pid of Object.keys(H.conns)){const p=P_(pid);if(p&&p.on&&now-(H.lastSeen[pid]||0)>12000){p.on=false;ch=true}}
 if(H.onTimeout&&H.st.deadline&&now>H.st.deadline+800){const f=H.onTimeout;clearTimer();try{f()}catch(e){console.error(e)}ch=true}
 if(ch)sync();
}
function hostData(conn,d){
 if(!d||typeof d!=='object')return;
 if(d.t==='join')return hostJoin(conn,d);
 const pid=conn.pid;if(!pid||H.conns[pid]!==conn)return;
 H.lastSeen[pid]=Date.now();const p=P_(pid);if(p&&!p.on){p.on=true;sync()}
 if(d.t==='act'&&d.a)hostAction(pid,d.a);
}
function hostJoin(conn,d){
 const st=H.st;const pid=String(d.pid||'').slice(0,24);if(!pid)return;let p=P_(pid);
 if(!p){
  if(st.screen!=='lobby')return conn.send({t:'err',msg:'A resenha já começou! Espera a galera voltar pro lobby e entra de novo.'});
  if(st.players.length>=MAX_PLAYERS)return conn.send({t:'err',msg:'Sala cheia (máximo 8 pessoas).'});
  const used=st.players.map(x=>x.color);
  p={id:pid,name:cleanName(d.name),color:COLORS_P.find(c=>!used.includes(c))||pick(COLORS_P),avatar:null,score:0,on:true};
  st.players.push(p);sysMsg(st.chat,`${p.name} entrou no grupo`,'users');
 } else p.on=true;
 p.relay=!!conn.relay;
 const old=H.conns[pid];H.conns[pid]=conn;conn.pid=pid;H.lastSeen[pid]=Date.now();
 if(old&&old!==conn){try{old.close()}catch(e){}}
 for(const [id,data] of Object.entries(H.images))try{conn.send({t:'img',id,d:data})}catch(e){}
 sync();
}
function hostClose(conn){const pid=conn.pid;if(pid&&H.conns[pid]===conn){delete H.conns[pid];const p=P_(pid);if(p){p.on=false;sync()}}}

function hostAction(pid,a){
 const st=H.st;if(!st||!a)return;const p=P_(pid);if(!p)return;const isHost=pid===st.hostId;
 try{
  switch(a.a){
   case 'chat':chatAct(pid,a);break;
   case 'react':{const now=Date.now();if(REACTS.includes(a.e)&&now-(H.lastReact[pid]||0)>250){H.lastReact[pid]=now;broadcastFx({t:'fx',e:a.e,name:p.name})}return}
   case 'settings':if(isHost&&st.screen==='lobby'){const ms=Array.isArray(a.modes)?a.modes:[];st.settings.modes=MODE_ORDER.filter(x=>ms.includes(x));if([0.7,1,1.4].includes(a.speed))st.settings.speed=a.speed}break;
   case 'start':if(isHost&&st.screen==='lobby'&&activeIds().length>=MIN_PLAYERS&&st.settings.modes.length)startGame();break;
   case 'skip':if(isHost&&H.onTimeout){const f=H.onTimeout;clearTimer();f()}break;
   case 'lobby':if(isHost&&st.screen!=='lobby')backToLobby();break;
   default:if(st.screen==='play'&&MH[st.mode]&&H.mx.part&&H.mx.part.includes(pid)){if(MH[st.mode].act(pid,a)==='nosync')return}
  }
 }catch(e){console.error(e)}
 sync();
}
function chatAct(pid,a){
 const st=H.st;if(st.screen!=='lobby')return;const list=st.chat;
 const text=String(a.text||'').slice(0,200).trim();const img=a.img&&H.images[a.img]?a.img:null;
 if(!text&&!img)return;
 list.push({id:++H.msgId,pid,text:img?'':text,img});
 if(list.length>150)list.splice(0,list.length-150);
}

/* ---------- fluxo da partida ---------- */
function startGame(){
 const st=H.st;st.queue=MODE_ORDER.filter(id=>st.settings.modes.includes(id));st.modeIdx=-1;
 st.players.forEach(p=>{p.score=0;H.prev[p.id]=0});st.deltas={};H.stats={};H.champ=null;st.official=null;st.retro=null;
 nextMode();
}
function nextMode(){
 const st=H.st;H.gen++;st.modeIdx++;
 if(st.modeIdx>=st.queue.length)return toRetro();
 st.mode=st.queue[st.modeIdx];st.screen='intro';st.m=null;H.priv={};
 setTimer(9,beginMode,false);
}
function beginMode(){const st=H.st;st.screen='play';H.mx={part:activeIds()};H.priv={};H.gen++;MH[st.mode].start()}
function endMode(){
 const st=H.st;clearTimer();H.gen++;H.priv={};st.deltas={};
 st.players.forEach(p=>{st.deltas[p.id]=p.score-(H.prev[p.id]||0);H.prev[p.id]=p.score});
 st.screen='scores';st.m=null;setTimer(12,nextMode,false);
}
function backToLobby(){const st=H.st;clearTimer();H.gen++;st.screen='lobby';st.m=null;st.mode=null;st.retro=null;H.priv={};sysMsg(st.chat,'Voltamos pro lobby! Bora mais uma?','party')}
function toRetro(){
 const st=H.st;clearTimer();H.gen++;const S=id=>H.stats[id]||{};const ps=st.players;
 const best=k=>{let b=null,bv=0;ps.forEach(p=>{const x=S(p.id)[k]||0;if(x>bv){bv=x;b=p.id}});return b?{pid:b,v:bv}:null};
 const aw=[];let x;const s_=(n,a,b)=>n>1?b:a;
 if(x=best('carlaoWins'))aw.push({e:'carlao',t:'Bobão do Ano',pid:x.pid,d:`Furou ${x.v} ${s_(x.v,'rolê','rolês')} sem dó`});
 if(x=best('drawVotes'))aw.push({e:'palette',t:'Picasso do Grupo',pid:x.pid,d:`${x.v} ${s_(x.v,'voto','votos')} nos desenhos`});
 if(H.champ)aw.push({e:'figurinha',t:'Rei/Rainha das Figurinhas',pid:H.champ,d:'Criou a figurinha oficial'});
 if(x=best('correct'))aw.push({e:'magnifier',t:'Detetive',pid:x.pid,d:`${x.v} ${s_(x.v,'palpite certeiro','palpites certeiros')}`});
 if(x=best('fooled'))aw.push({e:'mask',t:'Mestre do Disfarce',pid:x.pid,d:`Enganou a galera ${x.v} ${s_(x.v,'vez','vezes')}`});
 if(x=best('impWins'))aw.push({e:'impostor',t:'Impostor Lendário',pid:x.pid,d:`Enganou todo mundo ${x.v} ${s_(x.v,'vez','vezes')}`});
 if(x=best('quiz'))aw.push({e:'quiz',t:'Gênio da Resenha',pid:x.pid,d:`${x.v} ${s_(x.v,'acerto','acertos')} no quiz`});
 if(x=best('believed'))aw.push({e:'angel',t:'Mais Sincero',pid:x.pid,d:`${x.v} ${s_(x.v,'pessoa acreditou','pessoas acreditaram')} nas respostas`});
 if(x=best('lieVotes'))aw.push({e:'liar',t:'Pinóquio do Grupo',pid:x.pid,d:`${x.v} ${s_(x.v,'voto','votos')} de "mentiu!"`});
 if(x=best('amarelou'))aw.push({e:'shock',t:'Amarelão',pid:x.pid,d:`Fugiu de ${x.v} ${s_(x.v,'pergunta','perguntas')}`});
 st.retro={awards:aw,avatars:ps.filter(p=>p.avatar&&H.avatarBy[p.id]).map(p=>({of:p.id,by:H.avatarBy[p.id],img:p.avatar}))};
 st.screen='retro';st.m=null;
}

/* ---------- modos (lógica do host) ---------- */
const MH={};

MH.perfil={
 start(){
  const ids=shuffle(H.mx.part);const n=ids.length;H.mx.subs={};
  ids.forEach((id,i)=>{H.priv[id]={target:ids[(i+1)%n]}});
  H.st.m={phase:'draw',done:[]};setTimer(75,MH.perfil.toVote);
 },
 act(pid,a){
  const m=H.st.m,X=H.mx;
  if(a.a==='draw'&&m.phase==='draw'&&!m.done.includes(pid)&&H.priv[pid]){
   const id=storeImg(a.data);if(!id)return;X.subs[pid]=id;m.done.push(pid);
   if(allDone(m.done)){clearTimer();MH.perfil.toVote()}
  } else if(a.a==='vote'&&m.phase==='vote'&&!m.voted.includes(pid)){
   const e=m.entries[a.i];if(!e||X.artistOf[e.img]===pid)return;
   X.votes[pid]=a.i;m.voted.push(pid);
   if(allDone(m.voted)){clearTimer();MH.perfil.results()}
  }
 },
 toVote(){
  const m=H.st.m,X=H.mx;X.artistOf={};const entries=[];
  for(const [artist,img] of Object.entries(X.subs)){
   const target=H.priv[artist].target;const tp=P_(target);
   if(tp){tp.avatar=img;H.avatarBy[target]=artist}
   X.artistOf[img]=artist;entries.push({img,of:target});addSticker(img);
  }
  if(!entries.length)return endMode();
  m.entries=shuffle(entries);m.voted=[];X.votes={};
  if(entries.length<2)return MH.perfil.results();
  m.phase='vote';setTimer(25,MH.perfil.results);
 },
 results(){
  const m=H.st.m,X=H.mx;const tally=m.entries.map(()=>0);
  Object.values(X.votes).forEach(i=>tally[i]++);
  m.entries.forEach((e,i)=>{const ar=X.artistOf[e.img];addPts(ar,tally[i]*100);if(tally[i])stat(ar,'drawVotes',tally[i])});
  m.tally=tally;m.phase='results';setTimer(10,endMode,false);
 }
};

MH.figurinha={
 start(){H.st.m={phase:'draw',theme:pick(FIG_THEMES),done:[]};H.mx.entries=[];setTimer(100,MH.figurinha.toBracket)},
 act(pid,a){
  const m=H.st.m,X=H.mx;
  if(a.a==='draw'&&m.phase==='draw'&&!m.done.includes(pid)){
   const id=storeImg(a.data);if(!id)return;X.entries.push({img:id,by:pid});m.done.push(pid);addSticker(id);
   if(allDone(m.done)){clearTimer();MH.figurinha.toBracket()}
  } else if(a.a==='vote'&&m.phase==='match'&&(a.i===0||a.i===1)&&!m.voted.includes(pid)){
   m.voted.push(pid);m.counts[a.i]++;
   if(allDone(m.voted)){clearTimer();MH.figurinha.resolve()}
  }
 },
 toBracket(){
  const X=H.mx;const e=shuffle(X.entries);if(!e.length)return endMode();
  X.round=e;X.next=[];X.mn=0;MH.figurinha.nextMatch();
 },
 nextMatch(){
  const X=H.mx;
  while(X.round.length<2){
   X.next.push(...X.round);X.round=[];
   if(X.next.length===1)return MH.figurinha.champion(X.next[0]);
   X.round=X.next;X.next=[];
  }
  const a=X.round.shift(),b=X.round.shift();X.cur=[a,b];X.mn++;
  const remaining=X.round.length+X.next.length+2;
  H.st.m={phase:'match',view:'match',k:X.mn,theme:H.st.m.theme,done:[],a:a.img,b:b.img,label:remaining===2?'GRANDE FINAL':remaining<=4?'Semifinal':'Quartas de final',final:remaining===2,voted:[],counts:[0,0]};
  setTimer(15,MH.figurinha.resolve);
 },
 resolve(){
  const X=H.mx,m=H.st.m;const c=m.counts;
  const w=c[0]>c[1]?0:c[1]>c[0]?1:rand(2);
  X.cur.forEach((en,i)=>{addPts(en.by,c[i]*100);if(c[i])stat(en.by,'drawVotes',c[i])});
  X.next.push(X.cur[w]);m.phase='matchResult';m.win=w;
  setTimer(4,MH.figurinha.nextMatch,false);
 },
 champion(en){
  addPts(en.by,500);H.st.official={img:en.img,by:en.by};H.champ=en.by;
  H.st.m={phase:'champion',k:'c',theme:H.st.m.theme,done:[],champ:en.img,by:en.by};
  setTimer(14,endMode,false);
 }
};

MH.rabisco={
 start(){
  const part=shuffle(H.mx.part);const carl=pick(part),word=pick(RABISCO_WORDS);H.mx.carl=carl;H.mx.word=word;
  part.forEach(id=>{H.priv[id]=id===carl?{carlao:true}:{word}});
  const laps=part.length<=4?3:2;
  H.st.m={phase:'draw',order:[].concat(...Array.from({length:laps},()=>part)),turn:-1,strokes:[],cur:null};
  MH.rabisco.nextTurn();
 },
 nextTurn(){
  const m=H.st.m;
  do{m.turn++}while(m.turn<m.order.length&&!(P_(m.order[m.turn])||{}).on);
  if(m.turn>=m.order.length)return MH.rabisco.toVote();
  m.cur=m.order[m.turn];setTimer(25,MH.rabisco.nextTurn);
 },
 act(pid,a){
  const m=H.st.m,X=H.mx;
  if(a.a==='stroke'&&m.phase==='draw'&&pid===m.cur&&Array.isArray(a.pts)&&a.pts.length>=2){
   const pts=a.pts.slice(0,1200).map(n=>Math.max(0,Math.min(1000,Math.round(+n||0))));if(pts.length%2)pts.pop();
   m.strokes.push({p:pts,c:P_(pid).color});clearTimer();MH.rabisco.nextTurn();
  } else if(a.a==='live'&&m.phase==='draw'&&pid===m.cur&&Array.isArray(a.pts)){
   broadcastFx({t:'live',p:a.pts.slice(0,1200),c:P_(pid).color},pid);return 'nosync';
  } else if(a.a==='vote'&&m.phase==='vote'&&a.t!==pid&&P_(a.t)&&!m.voted.includes(pid)){
   X.votes[pid]=a.t;m.voted.push(pid);
   if(allDone(m.voted)){clearTimer();MH.rabisco.resolve()}
  } else if(a.a==='guess'&&m.phase==='guess'&&pid===X.carl){
   const g=norm(a.text),w=norm(X.word);
   const ok=g===w||(g.length>=4&&(g.includes(w)||w.includes(g)));
   clearTimer();MH.rabisco.final(true,ok,String(a.text).slice(0,40));
  }
 },
 toVote(){const m=H.st.m;m.phase='vote';m.cur=null;m.voted=[];H.mx.votes={};setTimer(30,MH.rabisco.resolve)},
 resolve(){
  const m=H.st.m,X=H.mx;const tally={};Object.values(X.votes).forEach(t=>tally[t]=(tally[t]||0)+1);
  const mx=Math.max(0,...Object.values(tally));const caught=mx>0&&tally[X.carl]===mx;m.tally=tally;
  if(caught&&(P_(X.carl)||{}).on){m.phase='guess';m.carl=X.carl;setTimer(25,()=>MH.rabisco.final(true,false,''))}
  else MH.rabisco.final(caught,false,null);
 },
 final(caught,guessOk,guess){
  const m=H.st.m,X=H.mx;const carlWins=!caught||guessOk;
  if(carlWins){addPts(X.carl,600);stat(X.carl,'carlaoWins')}
  else X.part.forEach(id=>{if(id!==X.carl)addPts(id,100)});
  Object.entries(X.votes).forEach(([v,t])=>{if(t===X.carl){addPts(v,200);stat(v,'correct')}});
  m.phase='result';m.res={carl:X.carl,word:X.word,caught,guess,guessOk,carlWins};
  setTimer(12,endMode,false);
 }
};

MH.fofoca={
 start(){
  const ids=shuffle(H.mx.part),X=H.mx;X.ids=ids;X.N=ids.length;X.steps=Math.min(X.N,6);X.chains=ids.map(()=>[]);
  H.st.m={phase:'step',step:0,steps:X.steps,done:[],k:0,kind:'text'};MH.fofoca.assign();
 },
 assign(){
  const X=H.mx,m=H.st.m,s=m.step;m.kind=s%2===0?'text':'draw';m.k=s;m.done=[];H.priv={};
  for(let c=0;c<X.N;c++){const pid=X.ids[(c+s)%X.N];H.priv[pid]={chain:c,kind:m.kind,step:s,prev:s>0?X.chains[c][s-1]:null}}
  setTimer(s===0?50:m.kind==='draw'?75:40,MH.fofoca.endStep);
 },
 act(pid,a){
  const m=H.st.m,X=H.mx,pr=H.priv[pid];
  if(m.phase!=='step'||!pr||pr.step!==m.step||m.done.includes(pid))return;
  let item=null;
  if(a.a==='text'&&m.kind==='text'){const t=String(a.text||'').trim().slice(0,140);if(!t)return;item={t:'text',by:pid,text:t}}
  else if(a.a==='draw'&&m.kind==='draw'){const id=storeImg(a.data);if(!id)return;item={t:'draw',by:pid,img:id};addSticker(id)}
  if(!item)return;
  X.chains[pr.chain][m.step]=item;addPts(pid,50);m.done.push(pid);
  if(allDone(m.done)){clearTimer();MH.fofoca.endStep()}
 },
 endStep(){
  const X=H.mx,m=H.st.m,s=m.step;
  for(let c=0;c<X.N;c++){if(!X.chains[c][s]){const by=X.ids[(c+s)%X.N];X.chains[c][s]=m.kind==='text'?{t:'text',by,text:'(ficou no vácuo)'}:{t:'draw',by,img:null}}}
  m.step++;
  if(m.step>=X.steps)return MH.fofoca.reveal();
  MH.fofoca.assign();
 },
 reveal(){
  const X=H.mx,m=H.st.m;H.priv={};m.phase='reveal';m.k='r';
  m.chains=X.chains.map((ch,c)=>({starter:X.ids[c],items:ch}));m.rc=0;m.ri=0;
  setTimer(5,MH.fofoca.adv,false);
 },
 adv(){
  const m=H.st.m;const ch=m.chains[m.rc];
  if(m.ri<ch.items.length-1){m.ri++;setTimer(ch.items[m.ri].t==='draw'?6:5,MH.fofoca.adv,false)}
  else if(m.rc<m.chains.length-1){m.rc++;m.ri=0;setTimer(5,MH.fofoca.adv,false)}
  else endMode();
 }
};

MH.quem={
 start(){H.mx.round=0;H.mx.rounds=2;H.mx.used=[];MH.quem.write()},
 write(){
  const X=H.mx;X.ans={};const left=QUEM_QS.filter(x=>!X.used.includes(x));const q=pick(left.length?left:QUEM_QS);X.used.push(q);
  H.priv={};H.st.m={phase:'write',k:X.round,q,done:[],round:X.round+1,rounds:X.rounds};
  setTimer(50,MH.quem.toGuess);
 },
 act(pid,a){
  const m=H.st.m,X=H.mx;
  if(a.a==='text'&&m.phase==='write'&&!m.done.includes(pid)){
   const t=String(a.text||'').trim().slice(0,160);if(!t)return;X.ans[pid]=t;m.done.push(pid);
   if(allDone(m.done)){clearTimer();MH.quem.toGuess()}
  } else if(a.a==='guess'&&m.phase==='guess'&&!m.done.includes(pid)&&a.map&&typeof a.map==='object'){
   X.guesses[pid]=a.map;m.done.push(pid);
   if(allDone(m.done)){clearTimer();MH.quem.resolve()}
  }
 },
 toGuess(){
  const X=H.mx,m=H.st.m;
  const list=shuffle(Object.entries(X.ans).map(([pid,text])=>({pid,text})));
  if(list.length<2)return MH.quem.nextRound();
  X.list=list;X.guesses={};m.phase='guess';m.done=[];m.msgs=list.map((x,i)=>({i,text:x.text}));
  list.forEach((x,i)=>{H.priv[x.pid]={mine:i}});
  setTimer(60,MH.quem.resolve);
 },
 resolve(){
  const X=H.mx,m=H.st.m;const right=X.list.map(()=>[]);
  for(const [g,map] of Object.entries(X.guesses)){
   X.list.forEach((x,i)=>{if(x.pid===g)return;const gp=map[i];if(!gp)return;
    if(gp===x.pid){addPts(g,100);stat(g,'correct');right[i].push(g)}else{addPts(x.pid,50);stat(x.pid,'fooled')}});
  }
  m.phase='reveal';m.msgs=X.list.map((x,i)=>({i,text:x.text,by:x.pid,right:right[i]}));
  setTimer(14,MH.quem.nextRound,false);
 },
 nextRound(){H.mx.round++;if(H.mx.round>=H.mx.rounds)endMode();else MH.quem.write()}
};

MH.quiz={
 start(){const X=H.mx;X.qs=shuffle(QUIZ).slice(0,8);X.i=-1;X.streak={};MH.quiz.next()},
 next(){
  const X=H.mx;X.i++;if(X.i>=X.qs.length)return endMode();
  const q=X.qs[X.i];const order=shuffle([0,1,2,3]);X.right=order.indexOf(0);X.ans={};X.t0=Date.now();
  H.st.m={phase:'q',k:X.i,n:X.i+1,total:X.qs.length,q:q[0],opts:order.map(i=>q[1][i]),done:[]};
  setTimer(15,MH.quiz.reveal);
 },
 act(pid,a){
  const m=H.st.m,X=H.mx;
  if(a.a==='answer'&&m.phase==='q'&&!m.done.includes(pid)&&Number.isInteger(a.i)&&a.i>=0&&a.i<4){
   X.ans[pid]={i:a.i,t:Date.now()-X.t0};m.done.push(pid);
   if(allDone(m.done)){clearTimer();MH.quiz.reveal()}
  }
 },
 reveal(){
  const m=H.st.m,X=H.mx;const dur=15000*H.st.settings.speed;const picks={},gain={},streak={};
  X.part.forEach(pid=>{
   const an=X.ans[pid];if(an)picks[pid]=an.i;
   if(an&&an.i===X.right){
    const s=X.streak[pid]=(X.streak[pid]||0)+1;
    let g=Math.round(500+500*Math.max(0,1-an.t/dur));if(s>1)g+=Math.min(300,(s-1)*100);
    addPts(pid,g);gain[pid]=g;streak[pid]=s;stat(pid,'quiz');
   } else X.streak[pid]=0;
  });
  m.phase='reveal';m.right=X.right;m.picks=picks;m.gain=gain;m.streak=streak;
  setTimer(6,MH.quiz.next,false);
 }
};

MH.impostor={
 start(){
  const X=H.mx;const part=shuffle(X.part);const cat=pick(Object.keys(IMP_WORDS));const word=pick(IMP_WORDS[cat]);const imp=pick(part);
  X.imp=imp;X.word=word;X.cat=cat;
  part.forEach(id=>{H.priv[id]=id===imp?{impostor:true,cat}:{word,cat}});
  const order=part.slice();if(order[0]===imp&&order.length>1)order.push(order.shift()); // o impostor nunca começa
  H.st.m={phase:'clue',cat,order:order.concat(order),turn:-1,clues:[],cur:null};
  MH.impostor.next();
 },
 next(){
  const m=H.st.m;
  do{m.turn++}while(m.turn<m.order.length&&!(P_(m.order[m.turn])||{}).on);
  if(m.turn>=m.order.length)return MH.impostor.toVote();
  m.cur=m.order[m.turn];
  setTimer(30,()=>{m.clues.push({pid:m.cur,text:null});MH.impostor.next()});
 },
 act(pid,a){
  const m=H.st.m,X=H.mx;
  if(a.a==='clue'&&m.phase==='clue'&&pid===m.cur){
   const t=String(a.text||'').replace(/\s+/g,' ').trim().slice(0,24);if(!t)return;
   const nt=norm(t),nw=norm(X.word);if(pid!==X.imp&&(nt===nw||nt.includes(nw)))return; // não vale falar a palavra
   m.clues.push({pid,text:t});clearTimer();MH.impostor.next();
  } else if(a.a==='vote'&&m.phase==='vote'&&a.t!==pid&&P_(a.t)&&!m.voted.includes(pid)){
   X.votes[pid]=a.t;m.voted.push(pid);
   if(allDone(m.voted)){clearTimer();MH.impostor.resolve()}
  } else if(a.a==='guess'&&m.phase==='guess'&&pid===X.imp){
   const g=norm(a.text),w=norm(X.word);
   const ok=g===w||(g.length>=4&&(g.includes(w)||w.includes(g)));
   clearTimer();MH.impostor.final(true,ok,String(a.text).slice(0,40));
  }
 },
 toVote(){const m=H.st.m;m.phase='vote';m.cur=null;m.voted=[];H.mx.votes={};setTimer(45,MH.impostor.resolve)},
 resolve(){
  const m=H.st.m,X=H.mx;const tally={};Object.values(X.votes).forEach(t=>tally[t]=(tally[t]||0)+1);
  const mx=Math.max(0,...Object.values(tally));const caught=mx>0&&tally[X.imp]===mx;m.tally=tally;
  if(caught&&(P_(X.imp)||{}).on){m.phase='guess';m.imp=X.imp;setTimer(25,()=>MH.impostor.final(true,false,''))}
  else MH.impostor.final(caught,false,null);
 },
 final(caught,guessOk,guess){
  const m=H.st.m,X=H.mx;const impWins=!caught||guessOk;
  if(impWins){addPts(X.imp,600);stat(X.imp,'impWins')}
  else X.part.forEach(id=>{if(id!==X.imp)addPts(id,100)});
  Object.entries(X.votes).forEach(([v,t])=>{if(t===X.imp){addPts(v,200);stat(v,'correct')}});
  m.phase='result';m.res={imp:X.imp,word:X.word,cat:X.cat,caught,guess,guessOk,impWins};
  setTimer(14,endMode,false);
 }
};

MH.verdade={
 start(){const X=H.mx;X.order=shuffle(X.part).slice(0,8);X.r=-1;X.used=[];MH.verdade.next()},
 next(){
  const X=H.mx;
  do{X.r++}while(X.r<X.order.length&&!(P_(X.order[X.r])||{}).on);
  if(X.r>=X.order.length)return endMode();
  const left=VERDADES.filter(q=>!X.used.includes(q));const qs=shuffle(left.length>=2?left:VERDADES).slice(0,2);X.used.push(...qs);
  H.st.m={phase:'pick',k:X.r,hot:X.order[X.r],n:X.r+1,total:X.order.length,qs};
  setTimer(15,()=>MH.verdade.pickQ(rand(2)));
 },
 pickQ(i){const m=H.st.m;m.q=m.qs[i];m.phase='answer';setTimer(60,()=>MH.verdade.amarelou(true))},
 amarelou(timeout){const m=H.st.m;addPts(m.hot,-100);stat(m.hot,'amarelou');m.phase='result';m.amarelou=true;m.timeout=!!timeout;setTimer(6,MH.verdade.next,false)},
 act(pid,a){
  const m=H.st.m,X=H.mx;
  if(a.a==='pickq'&&m.phase==='pick'&&pid===m.hot&&(a.i===0||a.i===1)){clearTimer();MH.verdade.pickQ(a.i)}
  else if(a.a==='vanswer'&&m.phase==='answer'&&pid===m.hot){
   m.answer=String(a.text||'').trim().slice(0,240);m.voice=!m.answer;m.phase='judge';m.voted=[];X.jv={};
   clearTimer();setTimer(20,MH.verdade.judged);
  } else if(a.a==='skipq'&&m.phase==='answer'&&pid===m.hot){clearTimer();MH.verdade.amarelou(false)}
  else if(a.a==='judge'&&m.phase==='judge'&&pid!==m.hot&&!m.voted.includes(pid)&&(a.v==='t'||a.v==='l')){
   X.jv[pid]=a.v;m.voted.push(pid);
   if(allDone(m.voted,X.part.filter(id=>id!==m.hot))){clearTimer();MH.verdade.judged()}
  }
 },
 judged(){
  const m=H.st.m,X=H.mx;const t=[],l=[];Object.entries(X.jv).forEach(([p,v])=>(v==='t'?t:l).push(p));
  addPts(m.hot,t.length*100);if(t.length)stat(m.hot,'believed',t.length);if(l.length)stat(m.hot,'lieVotes',l.length);
  m.phase='result';m.trust=t;m.lie=l;setTimer(7,MH.verdade.next,false);
 }
};

/* =========================================================
   UI helpers
   ========================================================= */
const P=id=>V&&V.s.players.find(p=>p.id===id);
const nm=id=>esc((P(id)||{}).name||'?');
const isHostMe=()=>V&&V.s.hostId===ME.pid;
const onlineCount=v=>v.s.players.filter(p=>p.on).length;
const remain=()=>V&&V.s.deadline?Math.max(0,Math.ceil((V.s.deadline-(Date.now()+clockOffset))/1000)):0;
function imgTag(id,cls=''){return `<img class="${cls}" data-img="${id}" src="${IMG[id]||BLANK}" alt="">`}
function av(p,cls=''){
 if(!p)return `<span class="av ${cls}" style="background:#555"></span>`;
 if(p.avatar)return `<span class="av ${cls}" title="${esc(p.name)}">${imgTag(p.avatar)}</span>`;
 return `<span class="av ${cls}" style="background:${p.color};color:${p.color}" title="${esc(p.name)}">${spr(faceOf(p.id))}</span>`;

  $('#modes').onclick=e=>{if(!isHostMe())return;const b=e.target.closest('.mcard');if(!b)return;const id=b.dataset.id;let ms=V.s.settings.modes.slice();ms=ms.includes(id)?ms.filter(x=>x!==id):ms.concat(id);act({a:'settings',modes:ms,speed:V.s.settings.speed})};

  this.update(v);
 },
 update(v){

  setHTML($('#modehint'),host?'Clique pra ligar/desligar cada modo. Eles rolam nessa ordem.':'O anfitrião escolhe os modos.');
  setHTML($('#modes'),MODE_ORDER.map(id=>{const M=MODES[id],on=s.settings.modes.includes(id);return `<button class="mcard ${on?'on':''}" data-id="${id}" ${host?'':'disabled'}><span class="chk">${spr(on?'check':'box','s2')}</span>${mtile(id)}<span class="mt2">${M.n}</span><span class="md">${M.d}</span><span class="md">~${M.min} min</span></button>`}).join(''));
  const total=s.settings.modes.reduce((a,id)=>a+MODES[id].min,0);const dur=`<span class="muted small">Duração estimada: ~${Math.max(1,Math.round(total*s.settings.speed))} min</span>`;
  setHTML($('#speedrow'),host?`<label class="lbl" for="speed">Ritmo:</label><select id="speed">${[[0.7,'Rápido'],[1,'Normal'],[1.4,'Tranquilo']].map(([x,l])=>`<option value="${x}" ${s.settings.speed===x?'selected':''}>${l}</option>`).join('')}</select>${dur}`:dur);
  const n=s.players.filter(p=>p.on).length;
  setHTML($('#startbox'),host?`<button class="btn big" id="startBtn" ${n<MIN_PLAYERS||!s.settings.modes.length?'disabled':''}>${spr('rocket')} Começar a resenha</button><p class="muted small">${n<MIN_PLAYERS?`Precisa de pelo menos ${MIN_PLAYERS} pessoas online (o ideal é 4 a 8).`:!s.settings.modes.length?'Escolha pelo menos um modo.':`Tudo pronto! ${n} na sala.`}</p>`:`<p class="muted">Esperando ${nm(s.hostId)} começar a resenha…</p>`);
  chat.update(v);
 }

/* ---- telas genéricas: desenhar / escrever ---- */
function drawScreen(cfg){return ()=>{let pad=null,sent=false;return{
 mount(main,v){
  if(cfg.eligible&&!cfg.eligible(v)){main.innerHTML=waitHTML(`${spr('eyes','s3')}<p>Você entra na próxima rodada!</p>`);return}
  sent=cfg.done(v).includes(ME.pid);
  main.innerHTML=`<div class="stage">${cfg.head(v)}<div id="drawarea"></div><div class="muted small" id="prog"></div></div>`;
  if(sent){this.showSent();return}
  $('#drawarea').innerHTML=`<div id="pad"></div><div class="actions"><button class="btn big" id="sendBtn">${spr('send')} ${cfg.btn||'Enviar'}</button></div>`;
  pad=DrawPad($('#pad'),cfg.pad?cfg.pad(v):{});$('#sendBtn').onclick=()=>this.submit();this.update(v);
 },
 submit(){if(sent||!pad)return;sent=true;act(cfg.action(pad.getData()));this.showSent()},
 showSent(){const d=$('#drawarea');if(d)d.innerHTML=SENT('Enviado! Esperando a galera terminar…');pad=null},
 update(v){const p=$('#prog');if(p)p.textContent=`${cfg.done(v).length}/${onlineCount(v)} já enviaram`},
 tick(){if(!sent&&pad&&V.s.deadline&&remain()<=1&&pad.dirty())this.submit()}
}}}
function textScreen(cfg){return ()=>{let sent=false;return{
 mount(main,v){
  if(cfg.eligible&&!cfg.eligible(v)){main.innerHTML=waitHTML(`${spr('eyes','s3')}<p>Você entra na próxima rodada!</p>`);return}
  sent=cfg.done(v).includes(ME.pid);
  main.innerHTML=`<div class="stage">${cfg.head(v)}<div id="txtarea"></div><div class="muted small" id="prog"></div></div>`;
  if(sent){this.showSent();return}
  const showSug=cfg.sug&&(!cfg.showSug||cfg.showSug(v));
  $('#txtarea').innerHTML=`<textarea id="tin" maxlength="${cfg.max||140}" rows="3" placeholder="${esc(cfg.ph||'')}"></textarea><div class="actions">${showSug?`<button class="btn ghost" id="sugBtn">${spr('dice')} Me dá uma ideia</button>`:''}<button class="btn big" id="sendBtn">${spr('send')} Enviar</button></div>`;
  const tin=$('#tin');tin.focus();tin.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();this.submit()}};
  $('#sendBtn').onclick=()=>this.submit();if(showSug)$('#sugBtn').onclick=()=>{tin.value=cfg.sug(V);tin.focus()};
  this.update(v);
 },
 submit(){const tin=$('#tin');const t=tin&&tin.value.trim();if(sent||!t)return;sent=true;act({a:'text',text:t});this.showSent()},
 showSent(){const d=$('#txtarea');if(d)d.innerHTML=SENT()},
 update(v){const p=$('#prog');if(p)p.textContent=`${cfg.done(v).length}/${onlineCount(v)} já enviaram`},
 tick(){const tin=$('#tin');if(!sent&&V.s.deadline&&remain()<=1&&tin&&tin.value.trim())this.submit()}
}}}

SCR['rabisco:draw']=()=>{let board,n=-1,drawnTurn=-1;return{
 mount(main,v){main.innerHTML=`<div class="rabisco"><div class="rleft">${secretRabisco(v)}<div class="card"><div class="ptitle">Ordem dos traços</div><div id="order"></div></div></div><div class="rcenter"><div id="turninfo" class="headline sm"></div><div id="board"></div></div></div>`;board=StrokeBoard($('#board'));this.update(v)},
 update(v){
  const m=v.s.m;if(m.strokes.length!==n){n=m.strokes.length;board.redraw(m.strokes,null)}

  if(mine&&drawnTurn!==m.turn){const t=m.turn;board.enable(P(ME.pid).color,pts=>act({a:'live',pts}),pts=>{drawnTurn=t;act({a:'stroke',pts})})}

 },
 onLive(d){if(board)board.redraw(null,{p:d.p,c:d.c})}
}};

const QCOL=['#e63946','#3a86ff','#e09b00','#25a244'],QLET=['A','B','C','D'];
SCR['quiz:q']=S_({render:v=>{const m=v.s.m;const done=m.done.includes(ME.pid);const mine=LOCAL.ans;
  return `<div class="stage"><div class="pill">Pergunta ${m.n}/${m.total}</div><div class="headline qq">${esc(m.q)}</div>
  <div class="qgrid">${m.opts.map((o,i)=>`<button class="qopt ${mine===i?'on':''} ${done&&mine!==i?'dim':''}" data-i="${i}" ${done?'disabled':''} style="--qc:${QCOL[i]}"><span class="ql">${QLET[i]}</span><span>${esc(o)}</span></button>`).join('')}</div>
  <p class="muted small">${done?'Resposta enviada! ':''}${m.done.length}/${onlineCount(v)} responderam</p></div>`},
 bind:main=>{main.onclick=e=>{const b=e.target.closest('.qopt');if(!b||b.disabled)return;LOCAL.ans=+b.dataset.i;act({a:'answer',i:+b.dataset.i})}}});
SCR['quiz:reveal']=S_({render:v=>{const m=v.s.m;const g=m.gain[ME.pid];const picked=m.picks[ME.pid];const st=m.streak[ME.pid];
  return `<div class="stage"><div class="pill">Pergunta ${m.n}/${m.total}</div><div class="headline qq">${esc(m.q)}</div>
  <div class="qgrid">${m.opts.map((o,i)=>{const who=Object.keys(m.picks).filter(p=>m.picks[p]===i);return `<div class="qopt ${i===m.right?'right':'dim'}" style="--qc:${QCOL[i]}"><span class="ql">${i===m.right?spr('check'):QLET[i]}</span><span>${esc(o)}</span><span class="qwho">${who.map(id=>av(P(id),'xs')).join('')}</span></div>`}).join('')}</div>
  <div class="qres ${g?'ok':'bad'}">${g?`${spr('star')} Acertou! +${g}${st>1?` · ${st} seguidas ${spr('fire')}`:''}`:picked==null?`${spr('clock')} Não respondeu a tempo`:`${spr('x')} Errou!`}</div></div>`},
 mount:()=>{const g=V.s.m.gain[ME.pid];if(g){beep(880,.1,'triangle',.06);setTimeout(()=>beep(1320,.15,'triangle',.06),100)}else beep(220,.25,'sawtooth',.04)}});

/* ---- Impostor ---- */
function impSecret(v){return v.me.impostor
 ?`<div class="secret carl"><div class="sh">${spr('impostor','s3')}<div>Você é o <b>IMPOSTOR</b>!<br><small>Categoria: <b class="hl">${esc(v.me.cat)}</b></small></div></div><small>Você NÃO sabe a palavra. Preste atenção nas dicas da galera e disfarça!</small></div>`
 :`<div class="secret"><div class="sh">${spr('card','s3')}<div>Palavra secreta <small>(${esc(v.me.cat||'')})</small>:<br><span class="hl big">${esc(v.me.word||'?')}</span></div></div><small>Dê dicas que mostrem que você sabe, sem entregar demais pro impostor!</small></div>`}
function cluesHTML(v){const m=v.s.m;const players=m.order.slice(0,m.order.length/2);
 return `<div class="clues">${players.map(id=>{const cs=m.clues.filter(c=>c.pid===id);return `<div class="crow ${m.cur===id?'cur':''}">${av(P(id),'sm')}<b>${nm(id)}</b><span class="cchips">${cs.map(c=>c.text?`<span class="chip">${esc(c.text)}</span>`:`<span class="chip off">(ficou quieto)</span>`).join('')}${m.cur===id?'<span class="chip typing">pensando…</span>':''}</span></div>`}).join('')}</div>`}
SCR['impostor:clue']=()=>({
 mount(main,v){main.innerHTML=`<div class="rabisco"><div class="rleft">${impSecret(v)}</div><div class="rcenter"><div class="pill">Categoria: ${esc(v.s.m.cat)}</div><div id="turninfo" class="headline sm"></div><div id="myturn"></div><div id="clues" style="width:min(620px,94vw)"></div></div></div>`;this.update(v)},
 update(v){
  const m=v.s.m;const mine=m.cur===ME.pid;const lap=m.turn<m.order.length/2?1:2;
  setHTML($('#turninfo'),mine?`${spr('chat')} <span class="hl">Sua vez!</span> Mande UMA palavra de dica`:`${spr('chat')} Vez de ${av(P(m.cur),'sm')} <b>${nm(m.cur)}</b> <small class="muted">(rodada ${lap}/2)</small>`);
  const box=$('#myturn');
  if(mine&&!$('#clueIn')){
   setHTML(box,`<div class="row"><input id="clueIn" maxlength="24" placeholder="Sua dica (uma palavra)" autocomplete="off"><button class="btn yel" id="clueBtn">${spr('send')} Enviar</button></div>`);
   const inp=$('#clueIn');inp.focus();
   const go=()=>{const t=inp.value.trim();if(!t)return;if(!V.me.impostor&&V.me.word){const nt=norm(t),nw=norm(V.me.word);if(nt===nw||nt.includes(nw))return toast('Não vale falar a palavra!')}act({a:'clue',text:t});$('#clueBtn').disabled=true;inp.disabled=true};
   $('#clueBtn').onclick=go;inp.onkeydown=e=>{if(e.key==='Enter')go()};this.go=go;
  } else if(!mine)setHTML(box,'');
  setHTML($('#clues'),cluesHTML(v));
 },
 tick(){const inp=$('#clueIn');if(inp&&!inp.disabled&&inp.value.trim()&&V.s.deadline&&remain()<=1&&this.go)this.go()}
});
SCR['impostor:vote']=S_({render:v=>{const m=v.s.m;const voted=m.voted.includes(ME.pid);const ids=v.s.players.filter(p=>p.id!==ME.pid).map(p=>p.id);
  return `<div class="stage"><div class="headline">${spr('impostor')} Quem é o impostor?</div><p class="muted">${voted?'Voto registrado! Esperando a galera…':'Olhem as dicas e discutam na call!'}</p><div style="width:min(620px,94vw)">${cluesHTML(v)}</div>${voteGrid(ids,LOCAL.vote,voted)}<p class="muted small">${m.voted.length}/${onlineCount(v)} votaram</p>${impSecret(v)}</div>`},
 bind:main=>bindVote(main)});
SCR['impostor:guess']=()=>({mount(main,v){const m=v.s.m;const me=!!v.me.impostor;
 main.innerHTML=`<div class="stage">${spr('impostor','s6 bigico')}<div class="headline">Pegaram o impostor: ${av(P(m.imp),'md')} <span class="hl">${nm(m.imp)}</span>!</div>${me?`<p>Última chance: adivinhe a palavra secreta (categoria: <b>${esc(m.cat)}</b>) e vença mesmo assim!</p><div class="row"><input id="gin" maxlength="30" placeholder="A palavra era…"><button class="btn yel" id="gbtn">${spr('target')} Chutar</button></div>`:`<p class="muted">Calma… se o impostor acertar a palavra, ele vence mesmo assim!</p>`}<div style="width:min(620px,94vw)">${cluesHTML(v)}</div></div>`;
 if(me){const go=()=>{const t=$('#gin').value.trim();if(t){act({a:'guess',text:t});$('#gbtn').disabled=true;$('#gin').disabled=true}};$('#gbtn').onclick=go;$('#gin').onkeydown=e=>{if(e.key==='Enter')go()};$('#gin').focus()}
}});
SCR['impostor:result']=S_({render:v=>{const r=v.s.m.res;return `<div class="stage">${spr(r.impWins?'impostor':'party','s6 bigico')}<div class="headline">${r.impWins?'O IMPOSTOR VENCEU!':'A galera pegou o impostor!'}</div><div class="card"><p>O impostor era ${av(P(r.imp),'md')} <b class="hl">${nm(r.imp)}</b></p><p>A palavra era <b class="hl">${esc(r.word)}</b> <span class="muted">(${esc(r.cat)})</span></p>${r.caught?(r.guess!=null?`<p>Chute do impostor: “${esc(r.guess||'—')}” ${r.guessOk?'(acertou!)':'(errou)'}</p>`:''):'<p>A galera votou na pessoa errada!</p>'}</div><div style="width:min(620px,94vw)">${cluesHTML(v)}</div></div>`},
 mount:()=>burst(V.s.m.res.impWins?['impostor','clown','skull']:['party','magnifier','clap'])});

/* ---- Verdade ou Verdade ---- */
SCR['verdade:pick']=S_({render:v=>{const m=v.s.m;const me=m.hot===ME.pid;
  return `<div class="stage"><div class="pill">Rodada ${m.n}/${m.total}</div><div class="hotseat">${av(P(m.hot),'xl')}<div class="headline">${me?'Você está na BERLINDA!':`${nm(m.hot)} está na berlinda!`}</div></div><p class="muted">${me?'Escolha a pergunta que você vai responder:':'Escolhendo a pergunta… (vocês também veem as duas opções)'}</p><div class="vcards">${m.qs.map((q,i)=>`<button class="vcard" data-i="${i}" ${me?'':'disabled'}>${spr('angel','s2')}<span>${esc(q)}</span></button>`).join('')}</div></div>`},
 bind:main=>{main.onclick=e=>{const b=e.target.closest('.vcard');if(!b||b.disabled)return;act({a:'pickq',i:+b.dataset.i})}}});
SCR['verdade:answer']=()=>({mount(main,v){const m=v.s.m;const me=m.hot===ME.pid;
 main.innerHTML=`<div class="stage"><div class="hotseat">${av(P(m.hot),'lg')}<b>${nm(m.hot)}</b></div><div class="quote big">${spr('angel','s2')} ${esc(m.q)}</div>${me?`<textarea id="vin" maxlength="240" rows="3" placeholder="Sua resposta (ou responda em voz alta na call)"></textarea><div class="actions"><button class="btn big" id="vsend">${spr('send')} Responder</button><button class="btn ghost" id="vvoice">${spr('mic')} Respondi em voz alta</button><button class="btn pink" id="vskip">${spr('shock')} Amarelar (-100)</button></div>`:`<p class="muted">Esperando ${nm(m.hot)} responder… (pode ser em voz alta na call)</p>`}</div>`;
 if(me){const go=t=>{act({a:'vanswer',text:t});$$('.actions button',main).forEach(b=>b.disabled=true)};$('#vin').focus();
  $('#vsend').onclick=()=>{const t=$('#vin').value.trim();if(!t)return toast('Escreva a resposta ou clique em "Respondi em voz alta"');go(t)};
  $('#vvoice').onclick=()=>go('');$('#vskip').onclick=()=>{if(confirm('Amarelar e perder 100 pontos?'))act({a:'skipq'})}}
}});
SCR['verdade:judge']=S_({render:v=>{const m=v.s.m;const me=m.hot===ME.pid;const voted=m.voted.includes(ME.pid);
  return `<div class="stage"><div class="hotseat">${av(P(m.hot),'lg')}<b>${nm(m.hot)}</b></div><div class="quote">${esc(m.q)}</div><div class="answer">${m.voice?`${spr('mic','s2')} Respondeu em voz alta na call`:`“${esc(m.answer)}”`}</div>
  ${me?'<p class="muted">A galera tá decidindo se acredita em você…</p>':voted?SENT('Voto registrado!'):`<div class="actions"><button class="btn big" data-v="t">${spr('angel')} Acredito</button><button class="btn big pink" data-v="l">${spr('liar')} Mentiu!</button></div>`}<p class="muted small">${m.voted.length}/${Math.max(0,onlineCount(v)-1)} votaram</p></div>`},
 bind:main=>{main.onclick=e=>{const b=e.target.closest('[data-v]');if(!b||b.disabled)return;$$('[data-v]',main).forEach(x=>x.disabled=true);act({a:'judge',v:b.dataset.v})}}});
SCR['verdade:result']=S_({render:v=>{const m=v.s.m;
  if(m.amarelou)return `<div class="stage">${spr('shock','s6 bigico')}<div class="headline">${nm(m.hot)} AMARELOU!</div><p class="muted">${m.timeout?'O tempo acabou sem resposta.':'Pulou a pergunta.'} -100 pontos</p><div class="quote">${esc(m.q||'')}</div></div>`;
  return `<div class="stage"><div class="hotseat">${av(P(m.hot),'lg')}<b>${nm(m.hot)}</b></div><div class="answer">${m.voice?`${spr('mic','s2')} Respondeu em voz alta`:`“${esc(m.answer)}”`}</div>
  <div class="verdict"><div class="vside ok">${spr('angel','s3')}<b>${m.trust.length} ${m.trust.length===1?'acreditou':'acreditaram'}</b><span>${m.trust.map(id=>av(P(id),'sm')).join('')}</span></div><div class="vside bad">${spr('liar','s3')}<b>${m.lie.length} ${m.lie.length===1?'acha':'acham'} que mentiu</b><span>${m.lie.map(id=>av(P(id),'sm')).join('')}</span></div></div>
  <p class="hl">+${m.trust.length*100} pontos pra ${nm(m.hot)}</p></div>`},
 mount:()=>{const m=V.s.m;burst(m.amarelou?['shock','clown']:m.lie.length>m.trust.length?['liar','clown']:['angel','heart'])}});

/* ---- Retrospectiva ---- */
SCR.retro=S_({render:v=>{const s=v.s,r=s.retro||{awards:[],avatars:[]};const sorted=s.players.slice().sort((a,b)=>b.score-a.score);
  return `<div class="stage"><div class="headline">${spr('trophy')} Retrospectiva da Resenha</div>
  <div class="podium">${[[sorted[1],2],[sorted[0],1],[sorted[2],3]].map(([p,n])=>p?`<div class="pod p${n}">${n===1?spr('crown','s2'):''}${av(p,'lg')}<b>${esc(p.name)}</b><span class="muted">${p.score} pts</span><div class="block">${spr('medal'+n)}</div></div>`:'').join('')}</div>
  ${r.awards.length?`<div class="awards">${r.awards.map(a=>`<div class="award">${spr(a.e)}<div class="at">${esc(a.t)}</div>${av(P(a.pid),'md')}<b>${nm(a.pid)}</b><small>${esc(a.d)}</small></div>`).join('')}</div>`:''}
  ${s.official?`<div class="card offc"><div class="ptitle">${spr('figurinha','s2')} Figurinha Oficial do Grupo</div><div class="fig win">${imgTag(s.official.img)}</div><small>por ${nm(s.official.by)}</small><button class="btn yel sm" id="dlOff">${spr('download')} Baixar</button></div>`:''}
  ${r.avatars.length?`<div class="card"><div class="ptitle">${spr('perfil','s2')} Quem desenhou quem? (revelado!)</div><div class="gal">${r.avatars.map(a=>`<div class="gitem"><span class="av xl">${imgTag(a.img)}</span><b>${nm(a.of)}</b><small class="muted">desenhado por <b>${nm(a.by)}</b></small></div>`).join('')}</div></div>`:''}
  ${rankHTML(s.players)}
  ${isHostMe()?`<button class="btn big" id="again">${spr('home')} Voltar pro lobby e jogar de novo</button>`:'<p class="muted">O anfitrião pode começar outra resenha</p>'}</div>`},
 bind:main=>{const d=$('#dlOff',main);if(d)d.onclick=()=>download(IMG[V.s.official.img],'figurinha-oficial');const g=$('#again',main);if(g)g.onclick=()=>act({a:'lobby'})},
 mount:()=>burst(['trophy','star','party','carlao'])});

/* ---------------- init ---------------- */
$('#reacts').innerHTML=REACTS.map(e=>`<button data-e="${e}" title="Reagir">${spr(e)}</button>`).join('');
let lastReact=0;$('#reacts').onclick=e=>{const b=e.target.closest('button');if(!b||Date.now()-lastReact<300)return;lastReact=Date.now();act({a:'react',e:b.dataset.e})};
render();
</script>
</body>
</html>
